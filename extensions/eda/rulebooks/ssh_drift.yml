---
- name: SSH configuration drift remediation
  hosts: all

  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Remediate SSH configuration drift
      condition: event.payload.event_type == "configuration_drift"

      action:
        run_job_template:
          name: Remediate SSH Configuration Drift
          organization: Default
